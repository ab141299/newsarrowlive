<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Arrow Data Migrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center justify-center font-sans">
    <div class="max-w-xl w-full bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-2xl">
        <h2 class="text-xl sm:text-2xl font-black text-amber-500 mb-2">News Arrow: 19 न्यूज़ ट्रांसफर टूल</h2>
        <p class="text-xs text-gray-400 mb-5">Firebase से आपकी 19 खबरें निकाल कर सीधे GitHub news.json में सेव करेगा।</p>

        <div class="space-y-4 text-sm">
            <div>
                <label class="block font-bold text-gray-300 mb-1">GitHub Personal Access Token (ghp_...)</label>
                <input type="password" id="gh-token" placeholder="टोकन यहाँ डालें..." class="w-full p-2.5 rounded-lg bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-amber-500 text-xs">
            </div>

            <button id="start-btn" onclick="startMigration()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold py-3 rounded-lg shadow-lg text-sm sm:text-base transition">
                🚀 19 खबरें GitHub में ट्रांसफर करें
            </button>

            <div id="status-box" class="hidden mt-4 p-4 rounded-lg bg-gray-900 border border-gray-700 text-xs font-mono">
                <p id="status-text" class="text-amber-400 font-bold mb-2">प्रतीक्षा की जा रही है...</p>
                <div id="log-list" class="space-y-1 text-gray-300 max-h-48 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKL_XkMlp74NcMKHJmzL-9xTqQjF3k6A0",
            authDomain: "newsarrow-199cf.firebaseapp.com",
            projectId: "newsarrow-199cf",
            storageBucket: "newsarrow-199cf.firebasestorage.app",
            messagingSenderId: "545957236502",
            appId: "1:545957236502:web:5df6cc317042a6c8916327",
            measurementId: "G-9RKDM3CW2V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const OWNER = "ab141299";
        const REPO = "newsarrowlive";

        window.startMigration = async function() {
            const tokenInput = document.getElementById('gh-token').value.trim() || localStorage.getItem('na_gh_token');
            if (!tokenInput) {
                alert('कृपया अपना GitHub Token डालें!');
                return;
            }

            const btn = document.getElementById('start-btn');
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const logList = document.getElementById('log-list');

            btn.disabled = true;
            statusBox.classList.remove('hidden');
            logList.innerHTML = '';
            statusText.innerText = "⏳ Firebase से खबरें लोड की जा रही हैं...";

            try {
                const querySnapshot = await getDocs(collection(db, "news"));
                const oldNews = [];

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let postDate = data.date;
                    if (!postDate && data.timestamp) {
                        try {
                            postDate = new Date(data.timestamp.seconds * 1000).toLocaleDateString('hi-IN');
                        } catch(e) {
                            postDate = '22 Oct 2026';
                        }
                    }

                    oldNews.push({
                        id: docSnap.id,
                        title: data.title || 'शीर्षक उपलब्ध नहीं',
                        category: data.category || 'Varanasi',
                        reporter: data.reporter || 'अभय श्रीवास्तव / News Arrow Bureau',
                        date: postDate || '22 Oct 2026',
                        image: data.image || '',
                        video: data.video || '',
                        isBreaking: !!data.isBreaking,
                        metaDescription: data.metaDescription || '',
                        keywords: data.keywords || '',
                        content: data.content || ''
                    });

                    const p = document.createElement('p');
                    p.className = "text-emerald-400";
                    p.innerText = `✔ प्राप्त: ${data.title ? data.title.substring(0, 35) : docSnap.id}...`;
                    logList.appendChild(p);
                });

                if (oldNews.length === 0) {
                    throw new Error("Firebase से कोई खबर नहीं मिली। कृपया कनेक्शन जांचें।");
                }

                statusText.innerText = `कुल ${oldNews.length} खबरें मिल गईं! अब GitHub में सेव हो रही हैं...`;

                // Fetch news.json sha
                const ghRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/news.json`, {
                    headers: { 'Authorization': `token ${tokenInput}` }
                });

                let sha = null;
                if (ghRes.ok) {
                    const fileObj = await ghRes.json();
                    sha = fileObj.sha;
                }

                // UTF-8 to Base64
                const jsonString = JSON.stringify(oldNews, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/news.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${tokenInput}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Migrated ${oldNews.length} articles from Firebase to news.json`,
                        content: base64Content,
                        sha: sha
                    })
                });

                if (!putRes.ok) {
                    const errDetail = await putRes.json();
                    throw new Error(`GitHub एरर: ${errDetail.message || 'टोकन की अनुमति जांचें'}`);
                }

                statusText.innerText = `🎉 पूरी ${oldNews.length} खबरें सफलतापूर्वक news.json में सेव हो गईं!`;
                statusText.className = "text-emerald-400 font-bold text-sm";
                
                const doneP = document.createElement('p');
                doneP.className = "text-amber-400 font-bold mt-2";
                doneP.innerText = "काम पूरा हुआ! अब newsarrow.in खोलकर अपनी सारी खबरें देख सकते हैं।";
                logList.appendChild(doneP);

            } catch (err) {
                statusText.innerText = "❌ एरर: " + err.message;
                statusText.className = "text-red-400 font-bold text-sm";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
